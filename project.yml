name: Lilt
options:
  bundleIdPrefix: com.msllrs
  xcodeVersion: "26.3"
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    SWIFT_EMIT_LOC_STRINGS: "NO"

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0

targets:
  Lilt:
    type: application
    platform: macOS
    sources:
      - path: Lilt
        excludes:
          - "Resources/AppIcon.icon/**"
      - path: Lilt/Resources/AppIcon.icon
        type: file
        buildPhase: resources
    info:
      path: Config/Info.plist
      properties:
        CFBundleName: Lilt
        CFBundleDisplayName: Lilt
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "2"
        LSApplicationCategoryType: public.app-category.music
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: ""
        LSMinimumSystemVersion: "26.0"
        # Sparkle: where updates are announced, the key their signatures are checked against,
        # and the XPC installer the sandbox requires.
        SUFeedURL: https://msllrs.github.io/lilt/appcast.xml
        SUPublicEDKey: jvD3VVp7Q6+M0+UIdWA3cfAYR3WSTLoeKHgWH/5rflY=
        SUEnableInstallerLauncherService: true
    entitlements:
      path: Config/Lilt.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        # Sparkle's installer and downloader run as XPC services in the sandbox, reached through
        # these mach names.
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spks
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spki
    dependencies:
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.msllrs.Lilt
        PRODUCT_NAME: Lilt
        ENABLE_HARDENED_RUNTIME: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
      configs:
        # Debug stays ad hoc (the hardened runtime is then off, which lets the ad hoc test
        # bundle load). Release is signed with Developer ID for notarization and distribution.
        Release:
          CODE_SIGN_IDENTITY: "Developer ID Application: LFSGD LTD (TKGBUP8TGN)"
          DEVELOPMENT_TEAM: TKGBUP8TGN
          ENABLE_HARDENED_RUNTIME: "YES"
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
          # A plain build injects the get-task-allow debugging entitlement, which notarization
          # rejects; an archive would not, but neither does a build told not to.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: "NO"

  LiltTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: LiltTests
    dependencies:
      - target: Lilt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.msllrs.LiltTests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  Lilt:
    build:
      targets:
        Lilt: all
        LiltTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [LiltTests]
